<!doctype html>
<html lang="zh-CN">
  <head><meta charset="utf-8"><title>Analytics relay</title></head>
  <body>
    <script>
      (() => {
        const allowedParents = new Set([
          "https://carol-yueming-chen.github.io",
          "https://family-communication-priority.shawnpang.chatgpt.site",
          "http://localhost:3000",
          "http://localhost:5173",
        ]);
        window.addEventListener("message", async (event) => {
          if (!allowedParents.has(event.origin)) return;
          const message = event.data;
          if (!message || message.type !== "grandpa-analytics-batch" || typeof message.requestId !== "string") return;
          let ok = false;
          try {
            const response = await fetch("/api/analytics", {
              method: "POST",
              headers: { "Content-Type": "text/plain;charset=UTF-8" },
              body: JSON.stringify({ events: message.events }),
              keepalive: true,
            });
            ok = response.ok;
          } catch {}
          event.source?.postMessage({
            type: "grandpa-analytics-result",
            requestId: message.requestId,
            ok,
          }, event.origin);
        });
      })();
    </script>
  </body>
</html>
